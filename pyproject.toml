[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hub-cli"
version = "0.1.0"
description = "AI HUB CLI — free self-developing neural network hub in the console"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AI HUB CLI", email = "noreply@anthropic.com" }]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.scripts]
aihub = "ai_hub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_hub*"]

[tool.ruff]
line-length = 100
target-version = "py312"
